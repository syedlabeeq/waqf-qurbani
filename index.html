<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAQF QURBANI 2026 AZAD KASHMIR</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700&family=Amiri:wght@700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark-color: #2c3e50;
      --line-color: #7f8c8d;
      --card-bg: #f0f2f0;
      --page-bg: #e2e8e2;
      --muted-bg: rgba(44, 62, 80, 0.05);
      --accent: #0e7490;
      --accent-soft: rgba(14, 116, 144, 0.12);
      --danger: #c0392b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page-bg);
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color: #333;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .app-shell {
      max-width: 1300px;
      margin: 0 auto;
      padding: 20px;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(127, 140, 141, 0.3);
      background: #f8fafc;
      white-space: pre-line;
    }

    .status.error {
      border-color: #fecaca;
      background: #fef2f2;
      color: var(--danger);
    }

    .status.ok {
      border-color: #99f6e4;
      background: #f0fdfa;
      color: #0f766e;
    }

    .layout {
      display: block;
    }

    .cow-panel,
    .receipt-card {
      background: var(--card-bg);
      border: 1px solid var(--line-color);
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .cow-panel {
      padding: 14px;
      width: 60%;
      max-width: 720px;
      margin: 0 auto;
    }

    .panel-title {
      margin: 0 0 12px;
      padding: 8px 12px;
      font-family: 'Noto Kufi Arabic', sans-serif;
      color: var(--dark-color);
      background: var(--muted-bg);
      border-right: 4px solid var(--dark-color);
      border-left: 4px solid var(--dark-color);
      text-align: center;
      font-size: 1.05rem;
    }

    .cow-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    .cow-table th,
    .cow-table td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      text-align: right;
    }

    .cow-table thead th {
      background: rgba(44, 62, 80, 0.08);
      color: var(--dark-color);
      font-family: 'Noto Kufi Arabic', sans-serif;
      position: sticky;
      top: 0;
    }

    .cow-row {
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .cow-row:hover {
      background: rgba(14, 116, 144, 0.08);
    }

    .cow-row.active {
      background: var(--accent-soft);
    }

    .receipt-card {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      display: none;
    }

    .receipt-card.visible {
      display: block;
    }

    .header {
      background-color: var(--dark-color) !important;
      color: #ffffff !important;
      text-align: center;
      padding: 22px 10px;
      position: relative;
    }

    .header h2 {
      margin: 0;
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-size: 1.4rem;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .content-padding {
      padding: 25px;
    }

    .arabic-label {
      font-family: 'Amiri', serif;
      font-weight: bold;
      color: var(--dark-color);
      font-size: 1.15rem;
      white-space: nowrap;
    }

    .nastaliq-data {
      font-family: 'Noto Nastaliq Urdu', serif;
      font-size: 1.05rem;
      line-height: 2.2;
      color: #333;
    }

    .info-row {
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 8px;
      padding-bottom: 4px;
    }

    .info-value {
      min-width: 0;
      flex: 1;
      border-bottom: 1px solid rgba(127, 140, 141, 0.45);
      padding-bottom: 2px;
    }

    .participants-section {
      margin-top: 20px;
    }

    .participants-title {
      background-color: var(--muted-bg) !important;
      padding: 6px 15px;
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-size: 1.1rem;
      border-bottom: 1px solid var(--line-color);
      margin-bottom: 10px;
      color: var(--dark-color);
      text-align: center;
      border-right: 4px solid var(--dark-color);
      border-left: 4px solid var(--dark-color);
    }

    .participants-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .participants-list li {
      padding: 2px 15px;
      border-bottom: 0.5px solid rgba(0, 0, 0, 0.05);
      line-height: 2.4;
    }

    .financials {
      margin-top: 20px;
      background-color: rgba(255, 255, 255, 0.5) !important;
      padding: 15px;
      border: 1px solid var(--line-color);
      border-radius: 6px;
    }

    .financial-row {
      display: flex;
      justify-content: flex-start;
      gap: 15px;
      margin-bottom: 4px;
      align-items: flex-start;
    }

    .total-row {
      border-top: 1.5px solid var(--line-color);
      padding-top: 8px;
      margin-top: 5px;
      font-weight: bold;
      color: var(--danger) !important;
    }

    .footer-section {
      margin-top: 35px;
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 0;
    }

    .signature-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .signature-image {
      width: 95px;
      height: auto;
      display: block;
      margin-bottom: 6px;
      mix-blend-mode: multiply;
    }

    .signature-box {
      border-top: 1px solid #333;
      width: 160px;
      text-align: center;
      padding-top: 5px;
      font-family: 'Amiri', serif;
      font-weight: bold;
    }

    .stamp-box img {
      width: 85px;
      height: auto;
      display: block;
      mix-blend-mode: multiply;
      margin-right: -5px;
    }

    .print-btn {
      margin-top: 18px;
      padding: 12px 30px;
      background: var(--dark-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Noto Kufi Arabic', sans-serif;
      font-size: 1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: 0.3s;
      display: inline-block;
    }

    .print-btn:hover {
      background: #1a252f;
      transform: translateY(-2px);
    }

    .empty-state {
      padding: 18px;
      text-align: center;
      color: #667085;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 10px;
      border: 1px dashed rgba(127, 140, 141, 0.45);
      margin-top: 14px;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .cow-panel {
        width: 80%;
      }

      .receipt-card {
        max-width: none;
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        padding: 12px;
      }

      .cow-panel {
        width: 90%;
        max-width: none;
        padding: 10px;
      }

      .panel-title {
        font-size: 0.9rem;
        padding: 7px 10px;
        margin-bottom: 10px;
      }

      .status,
      .empty-state {
        font-size: 0.85rem;
        padding: 10px;
      }

      .cow-table {
        font-size: 0.86rem;
      }

      .cow-table th,
      .cow-table td {
        padding: 8px 6px;
      }

      .receipt-card {
        max-width: 100%;
      }

      .header {
        padding: 16px 42px 16px 42px;
      }

      .header h2 {
        font-size: 1.15rem;
      }

      .close-btn {
        top: 10px;
        right: 10px;
        width: 32px;
        height: 32px;
        font-size: 1.1rem;
      }

      .content-padding {
        padding: 14px;
      }

      .arabic-label {
        font-size: 0.95rem;
      }

      .nastaliq-data {
        font-size: 0.9rem;
        line-height: 1.9;
      }

      .info-row,
      .financial-row {
        gap: 10px;
      }

      .info-value {
        border-bottom: 1px solid rgba(127, 140, 141, 0.45);
      }
      .participants-title {
        font-size: 0.9rem;
        padding: 6px 10px;
      }

      .participants-list li {
        padding: 2px 10px;
        line-height: 2.1;
      }

      .financials {
        padding: 12px;
      }

      .signature-box {
        width: 120px;
        font-size: 0.95rem;
      }

      .signature-image {
        width: 74px;
      }

      .stamp-box img {
        width: 68px;
      }

      .print-btn {
        width: 100%;
        padding: 10px 16px;
        font-size: 0.9rem;
      }
    }

    @media print {
      body {
        background: white;
        font-size: 12px;
      }

      .cow-panel,
      .close-btn,
      .print-btn {
        display: none !important;
      }

      .app-shell {
        padding: 0;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .receipt-card {
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        border: 1px solid #333 !important;
        box-shadow: none;
      }

      .header {
        padding: 18px 10px;
      }

      .header h2 {
        font-size: 1.25rem;
      }

      .content-padding {
        padding: 18px;
      }

      .arabic-label {
        font-size: 0.95rem;
      }

      .nastaliq-data {
        font-size: 0.88rem;
        line-height: 1.9;
      }

      .info-row {
        gap: 10px;
        margin-bottom: 8px;
        padding-bottom: 4px;
      }

      .info-value {
        border-bottom: 1px solid #9ca3af;
        padding-bottom: 2px;
      }

      .participants-section,
      .financials {
        margin-top: 18px;
      }

      .participants-title {
        font-size: 0.9rem;
        padding: 6px 10px;
        margin-bottom: 10px;
      }

      .participants-list li {
        padding: 2px 10px;
        line-height: 2.15;
        border-bottom: 1px solid #d1d5db;
      }

      .financials {
        padding: 12px;
      }

      .financial-row {
        gap: 10px;
        margin-bottom: 4px;
      }

      .total-row {
        border-top: none;
      }

      .footer-section {
        margin-top: 28px;
      }

      .signature-image {
        width: 72px;
        margin-bottom: 4px;
      }

      .signature-box {
        width: 125px;
        font-size: 0.9rem;
      }

      .stamp-box img {
        width: 68px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="layout">
      <aside class="cow-panel">
        <div class="panel-title">رسیدیں</div>
        <div class="status" id="status">Loading...</div>
        <div id="cowTableWrap" hidden>
          <table class="cow-table">
            <thead>
              <tr>
                <th>گائے</th>
              </tr>
            </thead>
            <tbody id="cowTableBody"></tbody>
          </table>
        </div>
        <div id="cowEmptyState" class="empty-state">ڈیٹا لوڈ ہونے کا انتظار ہے...</div>
      </aside>

      <section class="receipt-card">
        <div class="header">
          <button type="button" class="close-btn" id="closeReceiptBtn" aria-label="بند کریں">×</button>
          <h2>الممتاز وقف قربانی 2026 - آزاد کشمیر</h2>
        </div>

        <div class="content-padding">
          <div class="info-row">
            <span class="arabic-label">زیر نگرانی:</span>
            <span class="nastaliq-data info-value" id="supervisorValue">—</span>
          </div>
          <div class="info-row">
            <span class="arabic-label">مقام قربانی:</span>
            <span class="nastaliq-data info-value" id="locationValue">—</span>
          </div>
          <div class="info-row">
            <span class="arabic-label">گائے نمبر:</span>
            <span class="nastaliq-data info-value" id="cowNumberValue">—</span>
          </div>
          <div class="info-row" id="extraRow" hidden>
            <span class="arabic-label" id="extraLabel">نوٹ:</span>
            <span class="nastaliq-data info-value" id="extraValue">—</span>
          </div>

          <div class="participants-section">
            <div class="participants-title">حصہ داران</div>
            <ul class="participants-list nastaliq-data" id="participantsList"></ul>
          </div>

          <div class="financials">
            <div class="financial-row">
              <span class="arabic-label">کل خرچ:</span>
              <span class="nastaliq-data info-value" id="expenseValue">—</span>
            </div>
            <div class="financial-row">
              <span class="arabic-label">کل وصول شدہ رقم:</span>
              <span class="nastaliq-data info-value" id="receivedValue">—</span>
            </div>
            <div class="financial-row total-row">
              <span class="arabic-label">بقایا:</span>
              <span class="nastaliq-data info-value" id="balanceValue">—</span>
            </div>
          </div>

          <div class="footer-section">
            <div class="stamp-box">
              <img src="./images/stamp.png" alt="Stamp">
            </div>
            <div class="signature-wrap">
              <img src="./images/signature.png" alt="Signature" class="signature-image">
              <div class="signature-box arabic-label">دستخط نگران</div>
            </div>
          </div>

          <button class="print-btn" onclick="window.print()">پرنٹ / محفوظ کریں</button>
        </div>
      </section>
    </section>
  </main>

  <script>
    const SHEET_ID = "1ZN2VCE_1tHWR6Fw3U_bP8iQ60-i2AJ-NqeOhBfnLSXk";
    const SHEET_GID = "670276725";
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=responseHandler:handleResponse`;

    const statusEl = document.getElementById("status");
    const cowPanelEl = document.querySelector(".cow-panel");
    const receiptCardEl = document.querySelector(".receipt-card");
    const cowTableWrapEl = document.getElementById("cowTableWrap");
    const cowTableBodyEl = document.getElementById("cowTableBody");
    const cowEmptyStateEl = document.getElementById("cowEmptyState");
    const closeReceiptBtnEl = document.getElementById("closeReceiptBtn");
    const supervisorValueEl = document.getElementById("supervisorValue");
    const locationValueEl = document.getElementById("locationValue");
    const cowNumberValueEl = document.getElementById("cowNumberValue");
    const extraRowEl = document.getElementById("extraRow");
    const extraLabelEl = document.getElementById("extraLabel");
    const extraValueEl = document.getElementById("extraValue");
    const participantsListEl = document.getElementById("participantsList");
    const expenseValueEl = document.getElementById("expenseValue");
    const receivedValueEl = document.getElementById("receivedValue");
    const balanceValueEl = document.getElementById("balanceValue");
    const MAX_PARTICIPANTS = 7;

    let sheetRows = [];
    let selectedIndex = 0;

    function setStatus(message, type) {
      statusEl.className = "status";
      if (type) {
        statusEl.classList.add(type);
      }
      statusEl.textContent = message;
    }

    function showCowPanel() {
      cowPanelEl.style.display = "block";
      receiptCardEl.classList.remove("visible");
    }

    function showReceipt() {
      cowPanelEl.style.display = "none";
      receiptCardEl.classList.add("visible");
    }

    function formatValue(value) {
      if (value === null || value === undefined) {
        return "";
      }
      return String(value).trim();
    }

    function parseAmount(value) {
      const cleaned = formatValue(value).replace(/[,\s]/g, "");
      if (!cleaned) {
        return null;
      }
      const numeric = Number(cleaned);
      return Number.isFinite(numeric) ? numeric : null;
    }

    function formatAmount(value) {
      const numeric = parseAmount(value);
      if (numeric === null) {
        return formatValue(value) || "—";
      }
      return new Intl.NumberFormat("en-IN").format(numeric);
    }

    function parseParticipants(value) {
      return formatValue(value)
        .split("،")
        .map((name) => name.trim())
        .filter(Boolean);
    }

    function normalizeRow(rowData, index) {
      const cells = (rowData.c || []).slice(0, 7).map((cell) => (cell ? (cell.v ?? "") : ""));

      return {
        index,
        supervisor: formatValue(cells[0]),
        location: formatValue(cells[1]),
        expense: formatValue(cells[2]),
        received: formatValue(cells[3]),
        participantsRaw: formatValue(cells[4]),
        participants: parseParticipants(cells[4]),
        cowNumber: formatValue(cells[5]) || String(index + 1),
        extra: formatValue(cells[6]),
      };
    }

    function renderCowTable(rows) {
      cowTableBodyEl.innerHTML = "";

      rows.forEach((row, index) => {
        const tr = document.createElement("tr");
        tr.className = "cow-row";
        tr.dataset.index = String(index);
        if (index === selectedIndex) {
          tr.classList.add("active");
        }

        const cowCell = document.createElement("td");
        cowCell.textContent = `گائے نمبر  ${index + 1}`;

        tr.appendChild(cowCell);

        tr.addEventListener("click", () => {
          selectedIndex = index;
          renderCowTable(sheetRows);
          renderReceipt(row, index);
          showReceipt();
        });

        cowTableBodyEl.appendChild(tr);
      });

      cowTableWrapEl.hidden = rows.length === 0;
      cowEmptyStateEl.hidden = rows.length > 0;
    }

    function renderReceipt(row, index) {
      supervisorValueEl.textContent = row.supervisor || "ابھی طے ہونا باقی ہے";
      locationValueEl.textContent = row.location || "بستی پلہ کڑپئی، پٹہکہ";
      cowNumberValueEl.textContent = row.cowNumber || `Cow ${index + 1}`;

      if (row.extra) {
        extraRowEl.hidden = false;
        extraLabelEl.textContent = "اضافی:";
        extraValueEl.textContent = row.extra;
      } else {
        extraRowEl.hidden = true;
      }

      participantsListEl.innerHTML = "";
      for (let participantIndex = 0; participantIndex < MAX_PARTICIPANTS; participantIndex += 1) {
        const li = document.createElement("li");
        const participant = row.participants[participantIndex] || "";
        li.textContent = `${participantIndex + 1}۔ ${participant}`;
        participantsListEl.appendChild(li);
      }

      expenseValueEl.textContent = formatAmount(row.expense);
      receivedValueEl.textContent = formatAmount(row.received);

      const expenseNumeric = parseAmount(row.expense);
      const receivedNumeric = parseAmount(row.received);
      if (expenseNumeric !== null && receivedNumeric !== null) {
        balanceValueEl.textContent = new Intl.NumberFormat("en-IN").format(receivedNumeric - expenseNumeric);
      } else {
        balanceValueEl.textContent = "—";
      }
    }

    function handleResponse(response) {
      try {
        const rows = response?.table?.rows || [];
        const dataRows = rows.map(normalizeRow).filter((row) => {
          return [row.supervisor, row.location, row.expense, row.received, row.participantsRaw, row.cowNumber, row.extra]
            .some((value) => String(value).trim() !== "");
        });

        if (!dataRows.length) {
          setStatus("No tabular data found in the response.", "error");
          return;
        }

        sheetRows = dataRows;
        renderCowTable(sheetRows);
        renderReceipt(sheetRows[selectedIndex], selectedIndex);
        statusEl.style.display = "none";
      } catch (error) {
        statusEl.style.display = "block";
        setStatus(`Could not parse spreadsheet response.\nReason: ${error.message}`, "error");
      }
    }

    window.handleResponse = handleResponse;

    closeReceiptBtnEl.addEventListener("click", () => {
      showCowPanel();
    });

    function loadSheet() {
      const script = document.createElement("script");
      script.src = GVIZ_URL;
      script.async = true;
      script.onerror = () => {
        statusEl.style.display = "block";
        setStatus("Failed to load Google gviz script. The sheet may not be public, or the endpoint may be unreachable.", "error");
      };
      document.body.appendChild(script);
    }

    function init() {
      statusEl.style.display = "block";
      setStatus("Loading sheet and building cow list...");
      showCowPanel();
      loadSheet();
    }

    init();
  </script>
</body>
</html>
